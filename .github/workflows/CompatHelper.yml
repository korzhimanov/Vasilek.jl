name: CompatHelper

# Opens a pull request when a dependency releases a version outside the
# [compat] bounds. Dependabot covers only the GitHub Actions here; without this
# nothing watches the Julia dependencies, of which NumericalIntegration's cap
# on Interpolations is the live example.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Install CompatHelper
        run: julia -e 'using Pkg; Pkg.add("CompatHelper")'
      - name: Run CompatHelper
        run: julia -e 'using CompatHelper; CompatHelper.main(; subdirs = ["", "verification", "benchmark"])'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
