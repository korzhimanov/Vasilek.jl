name: CI

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
  workflow_dispatch:
  # Mondays, 05:23 UTC. Off the hour on purpose: GitHub queues cron runs at the
  # top of the hour worst, and a job that starts twenty minutes late is a job
  # that did not run for anyone watching.
  #
  # The `prerelease` job below is the reason this exists. Its whole argument is
  # the weeks between an RC and the release, and it cannot make that argument on
  # push and pull_request alone -- this repository regularly goes a fortnight
  # without either, which is the same length as the window. An RC could ship,
  # break the package and reach its release without the job having run once.
  #
  # Everything else runs weekly too, rather than being gated off the schedule.
  # That is not just simpler: the package commits no Manifest, so every run
  # resolves its dependencies afresh, and a weekly full run is the only thing
  # that would catch a new Interpolations or FFTW release breaking us between
  # one PR and the next. Six jobs of about two minutes, once a week.
  #
  # Note that GitHub disables scheduled workflows after 60 days without a commit
  # to the repository, and emails the owner when it does. Re-enabling is a button
  # in the Actions tab.
  schedule:
    - cron: '23 5 * * 1'

concurrency:
  # cancel superseded runs on the same ref, but never on master
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # lts is the long-term-support release the [compat] floor targets;
        # '1' is the current stable. Windows is in the matrix because it is
        # the development machine.
        #
        # arch is deliberately not set: setup-julia@v3 defaults to the runner's
        # native architecture, which is how macos-latest gets aarch64 rather than
        # x86 under Rosetta. Pinning it back to x64 would test emulation instead.
        version: ['lts', '1']
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  prerelease:
    # Julia release candidates land weeks before the release itself, so this is
    # the window in which an upstream change that breaks the package -- or that
    # the package is relying on by accident -- can still be reported upstream
    # and fixed there rather than worked around here after the fact. The weekly
    # cron in `on:` is what makes that true rather than aspirational; on push and
    # pull_request alone this job would sit out most of the window it exists for.
    #
    # continue-on-error because the subject under test is Julia, not Vasilek: an
    # RC is allowed to be broken, and a red X on the required checks for someone
    # else's unreleased bug would train everyone to ignore the checks. The job
    # still reports its result, which is the point.
    #
    # The cost of that is silence: a green run sends no failure mail, so on the
    # scheduled runs -- where there is no PR check list to glance at -- a broken
    # RC is only visible by opening the Actions tab. Deliberate. Turning it into
    # a notification means either failing the run, which is what continue-on-error
    # is here to avoid, or opening an issue from the workflow, which needs write
    # permissions this workflow does not otherwise want.
    #
    # 'pre' resolves to the latest RC/beta/alpha, and to the latest stable when
    # no prerelease exists. Between release cycles this job is therefore a
    # duplicate of the ubuntu '1' entry in the matrix above; that is the price of
    # not having to re-edit the pin every time a cycle opens.
    name: Julia prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: 'pre'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # Non-blocking on purpose: a Codecov outage or rate limit is not a
          # code-correctness problem and should not turn the build red.
          fail_ci_if_error: false

  threads:
    # The reentrancy test in test/test_threading.jl is the only assertion that
    # the 0.2 scheme-value refactor achieved what it was for, and it degenerates
    # into a tautology on one thread. The matrix above runs at the Julia
    # default, so this job is what gives that test teeth.
    name: Multithreaded
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JULIA_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  boundscheck:
    # The advection kernels carry `@inbounds` on their interior loops, which
    # turns an index error there into silent memory corruption rather than a
    # BoundsError. Nothing in the normal matrix can see that. Forcing bounds
    # checking on makes the annotations non-binding for one run, so an index
    # that escapes its array shows up as a test failure instead of as a wrong
    # number months later.
    name: Bounds checking
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - run: julia --project=. -e 'using Pkg; Pkg.test(julia_args = ["--check-bounds=yes"])'

  verification:
    # `test/test_verification.jl` is gated behind VASILEK_EXTENDED=1 so that a
    # developer's `Pkg.test()` stays instant. Nothing set it. The body of that
    # file had therefore never executed in CI, which made the three claims in
    # the README's verification table -- the Landau damping rate and the two
    # energy drifts -- assertions in name only: they held whenever someone
    # remembered to export the variable by hand, and at no other time.
    #
    # Per-PR rather than nightly, and deliberately so. The benchmark suite is
    # advisory because wall-clock timing on a shared runner is not reliable at
    # any tolerance worth having; these are deterministic numerics, so that
    # argument does not carry over to them. The whole job is about two minutes.
    name: Extended verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VASILEK_EXTENDED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
