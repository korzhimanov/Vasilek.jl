[deps]
Documenter = "e30172f5-a6a5-5a46-863b-614d45cd2de4"
FFTW = "7a1cc6ca-52ef-59f5-83cd-3a7055c09341"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
Literate = "98b081ad-f1c9-55d3-8b20-4c87d4299306"
NumericalIntegration = "e7bfaba1-d571-5449-8927-abc22e82249b"
Plots = "91a5bcdd-55d7-5caf-9e0b-520d859cae80"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
SpecialFunctions = "276daf66-3868-5448-9aa4-cd146d93841b"
Vasilek = "c81326fb-3428-4180-b511-858f58317b28"

# Vasilek is not registered, so the environment takes it from the checkout.
# `[sources]` is read by Pkg from Julia 1.11 on, which is why the floor here is
# above the package's own 1.10. Everything below Literate is what the
# verification studies load, since docs/make.jl runs them in this process; keep
# it in step with verification/Project.toml.
[sources]
Vasilek = {path = ".."}

[compat]
Documenter = "1"
FFTW = "1.10"
LinearAlgebra = "1"
Literate = "2"
NumericalIntegration = "0.3"
Plots = "1"
Printf = "1"
SpecialFunctions = "2"
julia = "1.11"
